[project]
name = "expense-tracker"
version = "1.0.0"
description = "Portfolio-ready personal finance REST API built with FastAPI and PostgreSQL"
authors = [
    {name = "JoaoPSchiavoni",email = "Joaopschiavoni@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.115.0)",
    "uvicorn[standard] (>=0.30.0)",
    "sqlalchemy (>=2.0.0)",
    "pydantic-settings (>=2.2.0)",
    "pyjwt (>=2.8.0)",
    "bcrypt (>=4.0.0)",
    "alembic (>=1.13.0)",
    "psycopg2-binary (>=2.9.9)",
    "email-validator (>=2.3.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-multipart (>=0.0.20,<0.1.0)",
    "ofxparse2 (>=0.2.2,<0.3.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.14.0,<0.15.0)",
    "mypy (>=1.18.0,<2.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: integration tests that require a migrated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
