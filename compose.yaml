services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://expense_tracker:expense_tracker@db:5432/expense_tracker
      SECRET_KEY: ${SECRET_KEY:-local-development-key-change-before-production}
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_tracker -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
